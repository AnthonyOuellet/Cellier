/* ---------------------------- Formulaires (colonnes de la feuille) ---------------------------- */
const NUM_FIELDS = ['Qté', 'Millésime', "Année d'achat", 'Prix', 'À partir de', 'Garde', 'Note /10'];
// Champs propres à chaque millésime : jamais recopiés d'un autre millésime
const PER_VINTAGE = ['Qté', 'Millésime', "Année d'achat", 'À partir de', 'Note /10', 'Code-barres'];

/** Colonnes modifiables : toutes sauf les formules (Statut, Jusqu'à, Score) et la colonne d'inventaire. */
function editableHeaders(withQty) {
  const hs = S.headers.length ? S.headers : Object.keys(S.wines[0] || {}).filter(k => k !== 'row');
  return hs.filter(h => S.readonly.indexOf(h) < 0 && (withQty || h !== 'Qté'));
}

const cellStr = v => (v === null || v === undefined) ? '' : String(v);

/** Formulaire : un champ par colonne, avec suggestions tirées des valeurs déjà dans la feuille. */
function formHtml(fields, headers) {
  return headers.map((h, i) => {
    if (h === 'Photo') return photoWidget(cellStr(fields[h]));
    const isNum = NUM_FIELDS.indexOf(h) >= 0;
    let list = '';
    if (!isNum && h !== 'Nom' && h !== 'Code SAQ' && h !== 'Code-barres') {
      const vals = [...new Set(S.wines.map(w => cellStr(w[h]).trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'fr')).slice(0, 80);
      if (vals.length) list = '<datalist id="dl' + i + '">' + vals.map(v => '<option value="' + esc(v) + '">').join('') + '</datalist>';
    }
    return '<label class="field">' + esc(h) + '</label>' +
      '<input data-h="' + esc(h) + '"' + (isNum ? ' inputmode="decimal"' : '') +
      (list ? ' list="dl' + i + '"' : '') + ' value="' + esc(cellStr(fields[h])) + '">' + list;
  }).join('');
}

function readForm() {
  const o = {};
  document.querySelectorAll('#sheet [data-h]').forEach(el => { o[el.dataset.h] = el.value.trim(); });
  return o;
}

/** Les autres lignes du même vin (même nom, normalisé) : sources pour compléter un formulaire. */
function siblingsOf(name, exceptRow) {
  const n = normName(name);
  return n ? S.wines.filter(w => w.row !== exceptRow && normName(w['Nom']) === n)
    .sort((a, b) => num(b['Millésime']) - num(a['Millésime'])) : [];
}

/** Remplit les champs VIDES du formulaire avec ceux d'une autre ligne (sauf les champs propres au millésime). */
function fillFrom(row) {
  const w = S.wines.find(x => x.row === row);
  if (!w) return;
  let n = 0;
  document.querySelectorAll('#sheet [data-h]').forEach(el => {
    const h = el.dataset.h;
    if (PER_VINTAGE.indexOf(h) >= 0 || el.value.trim() || !cellStr(w[h]).trim()) return;
    el.value = cellStr(w[h]); n++;
  });
  toast(n ? n + ' champ' + (n > 1 ? 's complétés' : ' complété') : 'Aucun champ vide à compléter');
}

function siblingButtons(sibs) {
  if (!sibs.length) return '';
  return '<h3>Compléter les champs vides avec</h3>' + sibs.slice(0, 4).map(w =>
    '<button class="choice" onclick="fillFrom(' + w.row + ')"><div class="grow"><b>' + esc(w['Nom']) + '</b> ' +
    esc(w['Millésime'] || '') + '<small>' + esc([w['Producteur'], w['Pays'], w['Cépage']].filter(Boolean).join(' · ')) +
    '</small></div><span class="chip">Copier</span></button>').join('');
}

/* ---------------------------- Modifier une ligne ---------------------------- */
function startEdit(row) {
  const w = S.wines.find(x => x.row === row) || (S.current && S.current.matches.find(x => x.row === row));
  if (!w) return toast('Ligne introuvable : actualise le cellier (⟳)', true);
  S.current.edit = { row: w.row, name: w['Nom'], vintage: w['Millésime'], original: w };
  S.current.aiMarks = {};
  S.current.photoData = null;
  const hs = editableHeaders(true);
  openSheet('<h2>Modifier</h2><div class="meta">' + esc(w['Nom']) + ' ' + esc(w['Millésime'] || '') +
    ' · ligne ' + w.row + ' de ta feuille</div>' +
    siblingButtons(siblingsOf(w['Nom'], w.row)) +
    '<h3>Colonnes</h3>' + aiButton() + formHtml(w, hs) +
    '<p class="meta" style="margin-top:12px">Statut, Jusqu’à et Score se recalculent avec tes formules.</p>' +
    '<div class="row" style="margin-top:12px"><button class="btn" onclick="renderCard()">Annuler</button>' +
    '<button class="btn primary" id="btnSaveEdit">Enregistrer</button></div>');
  $('#btnSaveEdit').addEventListener('click', saveEdit);
}

async function saveEdit() {
  const e = S.current.edit;
  const form = readForm();
  const changed = {};
  Object.keys(form).forEach(h => { if (form[h] !== cellStr(e.original[h]).trim()) changed[h] = form[h]; });
  if (!Object.keys(changed).length && !S.current.photoData) { toast('Aucun changement'); return renderCard(); }
  if (changed['Nom'] === '') return toast('Le nom du vin est obligatoire', true);
  loadingSheet('Enregistrement dans la feuille…');
  try {
    const up = { row: e.row, name: e.name, vintage: e.vintage, fields: changed };
    if (S.current.photoData) { up.photoData = S.current.photoData; loadingSheet('Envoi de la photo…'); }
    await api('update', up, true);
    toast('Modifications enregistrées');
    closeSheet();
    loadData(true);
  } catch (err) {
    toast(err.message, true);
    renderCard();
  }
}

/* ---------------------------- Photos ---------------------------- */
function photoWidget(url) {
  return '<label class="field">Photo</label><div class="photo-box">' +
    '<img id="photoPrev" alt="" referrerpolicy="no-referrer"' + (url ? ' src="' + esc(url) + '"' : ' hidden') + '>' +
    '<div class="row"><label class="btn" for="photoInput">📷 Photo</label>' +
    '<button class="btn" type="button" onclick="openImageSearch()">🔎 Chercher</button>' +
    '<button class="btn" type="button" onclick="clearPhoto()">Retirer</button></div>' +
    '<input type="file" id="photoInput" accept="image/*" capture="environment" hidden onchange="onPhoto(this)">' +
    '<input type="hidden" data-h="Photo" value="' + esc(url) + '">' +
    '<div id="imgSearch" hidden><div class="row" style="margin-top:8px">' +
    '<input id="imgQ" type="search" placeholder="Nom du vin à chercher">' +
    '<button class="btn gold" type="button" style="flex:none" onclick="searchImages()">OK</button></div>' +
    '<div id="imgResults" class="img-grid"></div></div></div>';
}

/** Recherche d'images : SAQ, LCBO et Open Food Facts, à partir du nom du formulaire. */
function openImageSearch() {
  const box = $('#imgSearch');
  box.hidden = false;
  if (!$('#imgQ').value.trim()) {
    const f = readForm();
    const name = f['Nom'] || '';
    const prod = f['Producteur'] && normName(name).indexOf(normName(f['Producteur'])) < 0 ? f['Producteur'] + ' ' : '';
    $('#imgQ').value = (prod + name).trim();
  }
  $('#imgQ').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); searchImages(); } };
  if ($('#imgQ').value.trim()) searchImages(); else $('#imgQ').focus();
}

async function searchImages() {
  const q = $('#imgQ').value.trim();
  if (!q) return toast('Indique le nom du vin à chercher', true);
  const res = $('#imgResults');
  res.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spin"></div>Recherche d’images…</div>';
  try {
    const r = await api('images', { q });
    if (!$('#imgResults')) return;                      // formulaire fermé entre-temps
    const imgs = r.images || [];
    S.current.imgResults = imgs;
    res.innerHTML = imgs.length
      ? imgs.map((im, i) => '<button type="button" onclick="pickImage(' + i + ')" title="' + esc(im.title) + '">' +
          '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(im.url) + '" alt="" onerror="imgFallback(this)">' +
          '<span>' + esc(im.source) + (im.title ? ' · ' + esc(im.title) : '') + '</span></button>').join('')
      : '<p class="meta" style="grid-column:1/-1">Aucune image trouvée. Essaie un nom plus court (producteur + cuvée), ou prends une photo.</p>';
  } catch (e) {
    res.innerHTML = '';
    toast(e.message, true);
  }
}

/** Image LCBO en 640 px absente → vignette d'origine (319 px) ; sinon on retire la tuile. */
function imgFallback(img) {
  const src = img.getAttribute('src') || '';
  if (/thumb\.640\.640/.test(src)) {
    const alt = src.replace('thumb.640.640', 'thumb.319.319');
    const i = Number((img.parentNode.getAttribute('onclick') || '').replace(/\D/g, ''));
    if (S.current && S.current.imgResults && S.current.imgResults[i]) S.current.imgResults[i].url = alt;
    img.src = alt;
  } else {
    img.parentNode.remove();
  }
}

function pickImage(i) {
  const im = (S.current.imgResults || [])[i];
  if (!im) return;
  S.current.photoData = null;                           // une image choisie remplace une photo prise
  const prev = $('#photoPrev'), h = document.querySelector('#sheet [data-h="Photo"]');
  if (prev) { prev.src = im.url; prev.hidden = false; }
  if (h) h.value = im.url;
  $('#imgSearch').hidden = true;
  toast('Image choisie : elle sera enregistrée avec le vin');
}

/** Photo prise → JPEG réduit (900 px max) pour un envoi rapide. */
function onPhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 900 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k);
    cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    S.current.photoData = cv.toDataURL('image/jpeg', 0.78);
    URL.revokeObjectURL(img.src);
    restorePhoto();
    toast('Photo prête : elle sera enregistrée avec le vin');
  };
  img.onerror = () => toast('Photo illisible', true);
  img.src = URL.createObjectURL(file);
}

function restorePhoto() {
  const prev = $('#photoPrev');
  if (prev && S.current && S.current.photoData) { prev.src = S.current.photoData; prev.hidden = false; }
}

function clearPhoto() {
  S.current.photoData = null;
  const prev = $('#photoPrev'), h = document.querySelector('#sheet [data-h="Photo"]');
  if (prev) { prev.hidden = true; prev.removeAttribute('src'); }
  if (h) h.value = '';
}

/** Importation sans code-barres : formulaire de nouveau vin, avec photo. */
function addWithoutCode() {
  stopScan();
  S.current = { barcode: '', saq: '', product: null, matches: [], suggestions: [] };
  startAdd();
}

/* ---------------------------- IA (Gemini, via le script) ---------------------------- */
const AI_FIELDS = ['Producteur', 'Pays', 'Région / Appellation', 'Appellation', 'Type', 'Cépage', 'Pastille', 'Garde'];

function aiButton() {
  return S.ai ? '<button class="btn block" id="btnAI" style="margin-top:6px" onclick="runAI(false)">✨ Compléter avec l’IA</button>' : '';
}

function markAI(el) {
  el.classList.add('ai');
  const label = el.previousElementSibling;
  if (label && !label.querySelector('.ai-tag')) label.insertAdjacentHTML('beforeend', '<span class="ai-tag">✨ IA</span>');
  el.addEventListener('input', () => {
    el.classList.remove('ai');
    const t = label && label.querySelector('.ai-tag'); if (t) t.remove();
    if (S.current && S.current.aiMarks) delete S.current.aiMarks[el.dataset.h];
  }, { once: true });
}

/** Après un nouvel affichage du formulaire, remettre la marque ✨ IA sur les valeurs suggérées. */
function remarkAI() {
  const marks = (S.current && S.current.aiMarks) || {};
  Object.keys(marks).forEach(h => {
    const el = document.querySelector('#sheet [data-h="' + CSS.escape(h) + '"]');
    if (el && el.value === marks[h]) markAI(el);
  });
}

/** Demande à Gemini les champs vides du formulaire ouvert ; ne remplit que ceux encore vides. */
async function runAI(auto) {
  const ctx = S.current;
  if (!ctx) return;
  const form = readForm();
  if (!form['Nom']) return auto ? null : toast('Indique d’abord le nom du vin', true);
  const btn = $('#btnAI');
  if (btn) { btn.disabled = true; btn.textContent = '✨ L’IA cherche…'; }
  try {
    const r = await api('suggest', { fields: form }, true);
    if (S.current !== ctx || !isSheetOpen()) return;
    const marks = ctx.aiMarks || (ctx.aiMarks = {});
    let n = 0;
    Object.keys(r.suggestions || {}).forEach(h => {
      const el = document.querySelector('#sheet [data-h="' + CSS.escape(h) + '"]');
      if (el && !el.value.trim()) { el.value = r.suggestions[h]; marks[h] = el.value; markAI(el); n++; }
    });
    if (n) toast(n + ' champ' + (n > 1 ? 's suggérés' : ' suggéré') + ' par l’IA' +
      (r.confidence ? ' (confiance ' + r.confidence + ')' : '') + ' : vérifie-les');
    else if (!auto) toast('L’IA n’a rien de sûr à proposer pour ce vin');
  } catch (e) {
    toast(e.message, true);
  } finally {
    const b = $('#btnAI');
    if (b) { b.disabled = false; b.textContent = '✨ Compléter avec l’IA'; }
  }
}

/* ---------------------------- Ajouter ---------------------------- */
function startAdd() {
  const c = S.current;
  c.add = { target: c.matches.length ? c.matches[0].row : 'new', qty: 1, fields: null, aiDone: false };
  c.aiMarks = {};
  c.photoData = null;
  renderAdd();
}

/** Valeurs de départ d'un nouveau vin : autre millésime du même vin, puis fiche SAQ / LCBO pour le reste. */
function newWineDefaults(c) {
  const p = c.product || {};
  const sib = c.matches.slice().sort((a, b) => num(b['Millésime']) - num(a['Millésime']))[0] ||
    siblingsOf(p.name || (c.ref || {})['Nom'])[0] || null;
  const f = {};
  if (sib) Object.keys(sib).forEach(h => { if (h !== 'row' && PER_VINTAGE.indexOf(h) < 0) f[h] = cellStr(sib[h]); });
  const put = (h, v, override) => { if (v !== null && v !== undefined && v !== '' && (override || !cellStr(f[h]).trim())) f[h] = v; };
  put('Nom', p.name || (c.ref || {})['Nom']);
  put('Producteur', p.producer);
  put('Pays', p.country);
  put('Région / Appellation', p.region);
  put('Appellation', p.appellation);
  put('Type', p.type);
  put('Cépage', p.grape);
  put('Pastille', p.pastille);
  put('Garde', p.gardeYears);
  put('Prix', p.price, true);                                   // prix actuel de la fiche
  put('Code SAQ', c.saq || (p.source === 'SAQ' ? p.sku : ''));
  put('Photo', p.image);
  put("Lieux d'achat", { SAQ: 'SAQ', LCBO: 'LCBO' }[p.source] || (c.saq ? 'SAQ' : 'Hors SAQ'));
  f['Millésime'] = cellStr(p.vintage || '');
  f["Année d'achat"] = String(new Date().getFullYear());
  f['Code-barres'] = c.barcode || p.cup || '';
  f['À partir de'] = '';
  // Pour calculer « À partir de » une fois le millésime connu
  c.add.drinkNow = !!p.drinkNow;
  c.add.sibOffset = sib && num(sib['À partir de']) && num(sib['Millésime'])
    ? num(sib['À partir de']) - num(sib['Millésime']) : null;
  return f;
}

function renderAdd() {
  const c = S.current;
  const a = c.add;
  const p = c.product;
  if (isSheetOpen() && document.querySelector('#sheet [data-h]')) a.fields = readForm();   // garder la saisie
  const vintages = c.matches.slice().sort((x, y) => num(y['Millésime']) - num(x['Millésime']));
  let html = cardHeader(c) + '<h3>Ajouter au cellier</h3>';

  if (vintages.length) {
    html += vintages.map(m =>
      '<button class="choice' + (a.target === m.row ? ' selected' : '') + '" onclick="pickAdd(' + m.row + ')">' +
      matchLine(m) + '</button>').join('');
  }
  const srcLabel = p ? ({ LCBO: 'la fiche LCBO', OFF: 'Open Food Facts' }[p.source] || 'la fiche SAQ') : '';
  html += '<button class="choice' + (a.target === 'new' ? ' selected' : '') + '" onclick="pickAdd(\'new\')">' +
    '<div class="grow"><b>' + (vintages.length ? 'Un autre millésime' : 'Nouveau vin') + '</b>' +
    '<small>' + (vintages.length ? 'Pré-rempli avec ton autre millésime' + (p ? ' et ' + srcLabel : '')
      : p ? 'Pré-rempli avec ' + srcLabel : 'À remplir') + '</small></div></button>';

  html += '<label class="field">Nombre de bouteilles</label>' +
    '<div class="stepper"><button class="btn" onclick="stepAdd(-1)">−</button><output id="addQty">' + a.qty +
    '</output><button class="btn" onclick="stepAdd(1)">＋</button></div>';

  if (a.target === 'new') {
    if (!a.fields) a.fields = newWineDefaults(c);
    html += '<h3>Fiche du vin</h3>' +
      '<p class="meta">Vérifie surtout le <b>millésime</b> sur la bouteille. Tout reste modifiable plus tard (✎).</p>' +
      aiButton() + formHtml(a.fields, editableHeaders(false));
  }

  html += '<div class="row" style="margin-top:16px"><button class="btn" onclick="renderCard()">Annuler</button>' +
    '<button class="btn gold" id="btnDoAdd">Ajouter</button></div>';
  openSheet(html);
  $('#btnDoAdd').addEventListener('click', doAdd);
  remarkAI();
  restorePhoto();
  // IA automatique : une fois par formulaire de nouveau vin, s'il reste des champs vides
  if (a.target === 'new' && S.ai && !a.aiDone && AI_FIELDS.some(h => !cellStr(a.fields[h]).trim())) {
    a.aiDone = true;
    runAI(true);
  }
}

function pickAdd(t) { S.current.add.target = t; renderAdd(); }
function stepAdd(d) {
  const a = S.current.add;
  a.qty = Math.max(1, Math.min(48, a.qty + d));
  $('#addQty').textContent = a.qty;
}

async function doAdd() {
  const c = S.current;
  const a = c.add;
  const params = { qty: a.qty, barcode: c.barcode, saq: c.saq };

  if (a.target === 'new') {
    const f = readForm();
    const v = f['Millésime'] || '';
    if (v && !/^(19|20)\d{2}$/.test(v)) return toast('Millésime invalide (4 chiffres)', true);
    if (!f['Nom']) return toast('Indique le nom du vin', true);
    const dup = S.wines.find(w => normName(w['Nom']) === normName(f['Nom']) && cellStr(w['Millésime']).trim() === v);
    if (dup) {
      if (!c.matches.find(m => m.row === dup.row)) c.matches.push(dup);
      a.target = dup.row; renderAdd();
      return toast('Ce vin et ce millésime sont déjà dans ta feuille : sélectionné.');
    }
    if (!f['À partir de'] && v) {
      if (a.drinkNow) f['À partir de'] = v;
      else if (a.sibOffset !== null) f['À partir de'] = String(Number(v) + a.sibOffset);
    }
    params.fields = f;
    if (c.photoData) params.photoData = c.photoData;
    if (!params.barcode && f['Code-barres']) params.barcode = f['Code-barres'];
    if (!params.saq && f['Code SAQ']) params.saq = f['Code SAQ'];
  } else {
    const m = c.matches.find(x => x.row === a.target);
    Object.assign(params, { row: m.row, name: m['Nom'], vintage: m['Millésime'] });
  }

  loadingSheet('Ajout dans la feuille…');
  try {
    await api('add', params, true);
    toast(a.qty > 1 ? a.qty + ' bouteilles ajoutées' : 'Bouteille ajoutée');
    closeSheet();
    loadData(true);
  } catch (e) {
    toast(e.message, true);
    renderAdd();
  }
}

/* ---------------------------- Recherche de vins par nom (SAQ + LCBO) ---------------------------- */
function productSearchHtml(q) {
  return '<label class="field" for="prodQ">Chercher par nom (SAQ + LCBO)</label>' +
    '<div class="row"><input id="prodQ" type="search" placeholder="Producteur, cuvée…" value="' + esc(q) + '">' +
    '<button class="btn gold" style="flex:none" onclick="searchProducts()">OK</button></div>' +
    '<div id="prodResults" style="margin-top:8px"></div>';
}

/** Depuis le champ manuel du scanner : un nom tapé au lieu d'un code. */
function openNameSearch(q) {
  S.current = { barcode: '', saq: '', product: null, matches: [], suggestions: [] };
  openSheet('<h2>Chercher un vin</h2>' + productSearchHtml(q) +
    '<button class="btn block" style="margin-top:10px" onclick="closeSheet()">Fermer</button>');
  bindProductSearch();
  searchProducts();
}

function bindProductSearch() {
  const el = $('#prodQ');
  if (el) el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); searchProducts(); } };
}

async function searchProducts() {
  const q = (($('#prodQ') || {}).value || '').trim();
  if (!q) return toast('Tape le nom du vin', true);
  const box = $('#prodResults');
  box.innerHTML = '<div class="loading"><div class="spin"></div>Recherche à la SAQ et à la LCBO…</div>';
  try {
    const r = await api('products', { q });
    if (!$('#prodResults')) return;
    const list = r.products || [];
    S.current.prodResults = list;
    box.innerHTML = list.length
      ? list.map((p, i) => '<button class="choice" onclick="pickProduct(' + i + ')">' +
          (p.image ? '<img class="thumb" style="width:36px;height:54px;object-fit:contain;background:#fff;border-radius:6px;flex:none" ' +
            'loading="lazy" referrerpolicy="no-referrer" src="' + esc(p.image) + '" alt="" onerror="this.remove()">' : '') +
          '<div class="grow"><b>' + esc(p.name) + '</b><small>' + esc(p.source) + ' · ' + esc(p.sku) +
          (p.price ? ' · ' + money(Number(p.price)) : '') + '</small></div></button>').join('')
      : '<p class="meta">Aucun vin trouvé. Essaie moins de mots (producteur + cuvée).</p>';
  } catch (e) {
    box.innerHTML = '';
    toast(e.message, true);
  }
}

/** Vin choisi → sa fiche, comme après un scan ; le code-barres scanné est conservé. */
function pickProduct(i) {
  const p = (S.current.prodResults || [])[i];
  if (!p) return;
  const bc = S.current.barcode || '';
  if (p.source === 'SAQ') openLookup(bc, p.sku);
  else openLookup(bc, '', p.sku);
}

/** SKU trouvé sur lcbo.com → fiche LCBO, en gardant le code-barres scanné. */
function loadLcboSku() {
  const sku = (($('#lcboSku') || {}).value || '').replace(/\D/g, '');
  if (!sku) return toast('Entre le SKU (les chiffres du # sur lcbo.com)', true);
  openLookup((S.current && S.current.barcode) || '', '', sku);
}

/* =====================================================================
   Cellier : filtres, tri, liste
   ===================================================================== */
const splitGrapes = s => String(s || '')
  .split(/,|\/|\bet\b/i)
  .map(x => x.replace(/\d+\s*%?/g, '').replace(/\s+/g, ' ').trim())
  .filter(x => x.length > 1)
  .map(x => x.charAt(0).toUpperCase() + x.slice(1));

function fillSelect(id, label, values) {
  const el = $(id);
  const cur = el.value;
  const uniq = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  el.innerHTML = '<option value="">' + label + '</option>' +
    uniq.map(v => '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
}

function buildFilters() {
  const ws = S.wines.filter(w => $('#showEmpty').checked || qty(w) > 0);
  fillSelect('#fType', 'Tous les types', ws.map(w => w['Type']));
  fillSelect('#fPays', 'Tous les pays', ws.map(w => w['Pays']));
  fillSelect('#fCepage', 'Tous les cépages', ws.flatMap(w => splitGrapes(w['Cépage'])));
  fillSelect('#fPastille', 'Toutes les pastilles', ws.map(w => w['Pastille']));
  const st = $('#fStatut');
  const cur = st.value;
  st.innerHTML = '<option value="">Tous les statuts</option>' +
    STATUS_ORDER.map(s => '<option' + (s === cur ? ' selected' : '') + '>' + s + '</option>').join('');
}

function filteredWines() {
  const q = $('#q').value.trim().toLowerCase();
  const f = { t: $('#fType').value, p: $('#fPays').value, c: $('#fCepage').value, pa: $('#fPastille').value, s: $('#fStatut').value };
  const showEmpty = $('#showEmpty').checked;
  let ws = S.wines.filter(w => {
    if (!showEmpty && qty(w) <= 0) return false;
    if (f.t && w['Type'] !== f.t) return false;
    if (f.p && w['Pays'] !== f.p) return false;
    if (f.c && !splitGrapes(w['Cépage']).includes(f.c)) return false;
    if (f.pa && w['Pastille'] !== f.pa) return false;
    if (f.s && w['Statut'] !== f.s) return false;
    if (q) {
      const hay = [w['Nom'], w['Producteur'], w['Pays'], w['Région / Appellation'], w['Appellation'], w['Cépage'], w['Millésime']]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const by = $('#sort').value;
  const cmp = {
    score: (a, b) => num(b['Score']) - num(a['Score']),
    nom: (a, b) => String(a['Nom']).localeCompare(String(b['Nom']), 'fr'),
    millesime: (a, b) => num(a['Millésime']) - num(b['Millésime']),
    prix: (a, b) => num(b['Prix']) - num(a['Prix']),
    pays: (a, b) => String(a['Pays']).localeCompare(String(b['Pays']), 'fr') || num(b['Score']) - num(a['Score']),
    qte: (a, b) => qty(b) - qty(a)
  }[by];
  return ws.sort(cmp);
}

function renderList() {
  const ws = filteredWines();
  const bottles = ws.reduce((s, w) => s + Math.max(0, qty(w)), 0);
  $('#count').textContent = ws.length + ' vin' + (ws.length > 1 ? 's' : '') + ' · ' + bottles + ' bouteille' + (bottles > 1 ? 's' : '');
  if (!S.wines.length) {
    $('#list').innerHTML = '<div class="empty-state">' +
      (S.url ? 'Chargement du cellier…' : 'Configure l’app avec ⚙ pour charger ton cellier.') + '</div>';
    return;
  }
  if (!ws.length) { $('#list').innerHTML = '<div class="empty-state">Aucun vin ne correspond.</div>'; return; }
  $('#list').innerHTML = ws.map(w =>
    '<button class="wine' + (qty(w) <= 0 ? ' empty' : '') + '" onclick="openFromList(' + w.row + ')">' +
    '<span class="dot" style="background:' + (TYPE_COLORS[w['Type']] || '#777') + '"></span>' +
    (w['Photo'] ? '<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="' + esc(w['Photo']) + '" alt="">' : '') +
    '<span class="grow"><div class="name">' + esc(w['Nom']) + ' <span class="meta">' + esc(w['Millésime']) + '</span></div>' +
    '<div class="meta">' + esc([w['Pays'], w['Région / Appellation'], w['Pastille']].filter(Boolean).join(' · ')) + '</div>' +
    '<div class="status">' + esc(w['Statut'] || '') + (w['Score'] !== '' && w['Score'] != null ? ' · ' + pct(w['Score']) : '') + '</div></span>' +
    '<span class="qty">' + qty(w) + '</span></button>').join('');
}

['#q', '#fType', '#fPays', '#fCepage', '#fPastille', '#fStatut', '#sort'].forEach(id =>
  $(id).addEventListener('input', renderList));
$('#showEmpty').addEventListener('change', () => { buildFilters(); renderList(); });

/* =====================================================================
   Historique : tout ce qui a été bu (onglet Archive)
   ===================================================================== */
function buildHistoryFilters() {
  const yEl = $('#hYear'), tEl = $('#hType');
  const curY = yEl.value, curT = tEl.value;
  const years = [...new Set(S.archive.map(r => toDate(r['Bu le'])).filter(Boolean).map(d => d.getFullYear()))]
    .sort((a, b) => b - a);
  yEl.innerHTML = '<option value="">Toutes les années</option>' +
    years.map(y => '<option' + (String(y) === curY ? ' selected' : '') + '>' + y + '</option>').join('');
  const types = [...new Set(S.archive.map(r => r['Type']).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  tEl.innerHTML = '<option value="">Tous les types</option>' +
    types.map(t => '<option' + (t === curT ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
}

function renderHistory() {
  buildHistoryFilters();
  const q = $('#hq').value.trim().toLowerCase();
  const y = $('#hYear').value, t = $('#hType').value;
  const rows = S.archive
    .filter(r => {
      const d = toDate(r['Bu le']);
      if (y && (!d || String(d.getFullYear()) !== y)) return false;
      if (t && r['Type'] !== t) return false;
      if (q) {
        const hay = [r['Nom'], r['Producteur'], r['Avec'], r['Pays'], r['Cépage'], r['Millésime']].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => ((toDate(b['Bu le']) || 0) - (toDate(a['Bu le']) || 0)));

  $('#hCount').textContent = rows.length + ' bouteille' + (rows.length > 1 ? 's' : '') + ' bue' + (rows.length > 1 ? 's' : '');
  if (!S.archive.length) {
    $('#hList').innerHTML = '<div class="empty-state">' +
      (S.url ? 'Aucune bouteille dans l’Archive pour l’instant.' : 'Configure l’app avec ⚙ pour charger ton historique.') + '</div>';
    return;
  }
  if (!rows.length) { $('#hList').innerHTML = '<div class="empty-state">Aucune dégustation ne correspond.</div>'; return; }

  let html = '', lastMonth = '';
  rows.forEach(r => {
    const d = toDate(r['Bu le']);
    const month = d ? d.toLocaleDateString('fr-CA', { month: 'long', year: 'numeric' }) : 'Date inconnue';
    if (month !== lastMonth) { html += '<div class="month">' + esc(month) + '</div>'; lastMonth = month; }
    const note = r['Note /10'] !== '' && r['Note /10'] != null ? ' · ' + esc(r['Note /10']) + '/10' : '';
    html += '<button class="wine" onclick="openFromHistory(' + r.row + ')">' +
      '<span class="day">' + (d ? '<b>' + d.getDate() + '</b>' + esc(d.toLocaleDateString('fr-CA', { weekday: 'short' })) : '?') + '</span>' +
      '<span class="dot" style="background:' + (TYPE_COLORS[r['Type']] || '#777') + '"></span>' +
      '<span class="grow"><div class="name">' + esc(r['Nom']) + ' <span class="meta">' + esc(r['Millésime'] || '') + '</span></div>' +
      '<div class="meta">' + esc([r['Pays'], r['Pastille']].filter(Boolean).join(' · ')) + note + '</div>' +
      (r['Avec'] ? '<div class="status">avec ' + esc(r['Avec']) + '</div>' : '') +
      '</span></button>';
  });
  $('#hList').innerHTML = html;
}

/** Depuis l'historique : la carte du vin (s'il est encore au cellier, ses lignes ; sinon les infos archivées). */
function openFromHistory(row) {
  const r = S.archive.find(x => x.row === row);
  if (!r) return;
  const same = S.wines.filter(w => normName(w['Nom']) === normName(r['Nom']));
  S.current = {
    barcode: '', saq: String((same[0] || {})['Code SAQ'] || ''),
    product: null, matches: same, suggestions: [], ref: r
  };
  renderCard();
}

['#hq', '#hYear', '#hType'].forEach(id => $(id).addEventListener('input', renderHistory));

/* =====================================================================
   Statistiques
   ===================================================================== */
function countBy(items, keyFn, weightFn) {
  const m = new Map();
  items.forEach(it => {
    const keys = [].concat(keyFn(it)).filter(k => k !== '' && k != null);
    keys.forEach(k => m.set(k, (m.get(k) || 0) + (weightFn ? weightFn(it) : 1)));
  });
  return m;
}

function chart(id, cfg) {
  if (S.charts[id]) S.charts[id].destroy();
  S.charts[id] = new Chart(document.getElementById(id), cfg);
}

function baseOpts(horizontal) {
  return {
    responsive: true, maintainAspectRatio: false,
    indexAxis: horizontal ? 'y' : 'x',
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#b49aa8', precision: 0 }, grid: { color: horizontal ? '#3a2430' : 'transparent' } },
      y: { ticks: { color: '#e9dbe2', precision: 0 }, grid: { color: horizontal ? 'transparent' : '#3a2430' } }
    }
  };
}

function renderStats() {
  const stock = S.wines.filter(w => qty(w) > 0);
  if (!stock.length) { $('#kpis').innerHTML = '<div class="empty-state" style="grid-column:1/-1">Aucune donnée pour l’instant.</div>'; return; }
  const q = w => qty(w);

  const bottles = stock.reduce((s, w) => s + q(w), 0);
  const value = stock.reduce((s, w) => s + q(w) * num(w['Prix']), 0);
  const ready = stock.filter(w => num(w['Score']) >= 0.7).reduce((s, w) => s + q(w), 0);
  const yearAgo = new Date(); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
  const drunkYear = S.archive.filter(r => r['Bu le'] && new Date(r['Bu le']) >= yearAgo).length;
  $('#kpis').innerHTML = [
    [bottles, 'bouteilles'], [stock.length, 'vins différents'],
    [money(value), 'valeur du cellier'], [ready, 'prêtes à boire (≥ 70 %)'],
    [drunkYear, 'bues depuis 12 mois'], [bottles && drunkYear ? (bottles / drunkYear).toLocaleString('fr-CA', { maximumFractionDigits: 1 }) + ' ans' : '—', 'de réserve à ce rythme']
  ].map(([v, l]) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>').join('');

  const hasCharts = typeof Chart !== 'undefined';
  document.querySelectorAll('#view-stats .card').forEach(c => { c.style.display = hasCharts ? '' : 'none'; });
  if (!hasCharts) {
    $('#kpis').insertAdjacentHTML('beforeend', '<div class="empty-state" style="grid-column:1/-1">Graphiques indisponibles sans connexion.</div>');
    return;
  }
  Chart.defaults.color = '#e9dbe2';
  Chart.defaults.font.family = 'system-ui, sans-serif';

  // Statut
  const byStatus = countBy(stock, w => w['Statut'], q);
  chart('chStatut', {
    type: 'bar',
    data: {
      labels: STATUS_ORDER,
      datasets: [{ data: STATUS_ORDER.map(s => byStatus.get(s) || 0), backgroundColor: STATUS_COLORS, borderRadius: 6 }]
    },
    options: baseOpts(true)
  });

  // Type
  const byType = [...countBy(stock, w => w['Type'] || 'Autre', q)].sort((a, b) => b[1] - a[1]);
  chart('chType', {
    type: 'doughnut',
    data: {
      labels: byType.map(x => x[0]),
      datasets: [{ data: byType.map(x => x[1]), backgroundColor: byType.map(x => TYPE_COLORS[x[0]] || '#777'), borderColor: '#24141c', borderWidth: 3 }]
    },
    options: { responsive: true, maintainAspectRatio: false, cutout: '58%', plugins: { legend: { position: 'right', labels: { color: '#e9dbe2' } } } }
  });

  // Pays
  const byPays = [...countBy(stock, w => w['Pays'] || 'Inconnu', q)].sort((a, b) => b[1] - a[1]).slice(0, 12);
  chart('chPays', {
    type: 'bar',
    data: { labels: byPays.map(x => x[0]), datasets: [{ data: byPays.map(x => x[1]), backgroundColor: '#c2375f', borderRadius: 6 }] },
    options: baseOpts(true)
  });

  // Millésime
  const byMil = [...countBy(stock, w => String(w['Millésime'] || '').trim() || 'NV', q)]
    .sort((a, b) => (a[0] === 'NV') - (b[0] === 'NV') || num(a[0]) - num(b[0]));
  chart('chMillesime', {
    type: 'bar',
    data: { labels: byMil.map(x => x[0]), datasets: [{ data: byMil.map(x => x[1]), backgroundColor: '#e8b04b', borderRadius: 6 }] },
    options: baseOpts(false)
  });

  // Cépages
  const byGrape = [...countBy(stock, w => splitGrapes(w['Cépage']), q)].sort((a, b) => b[1] - a[1]).slice(0, 10);
  chart('chCepage', {
    type: 'bar',
    data: { labels: byGrape.map(x => x[0]), datasets: [{ data: byGrape.map(x => x[1]), backgroundColor: '#8fa7d9', borderRadius: 6 }] },
    options: baseOpts(true)
  });

  // Bues par mois
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  const key = d => d.getFullYear() + '-' + d.getMonth();
  const drunk = countBy(S.archive.filter(r => r['Bu le']), r => key(new Date(r['Bu le'])));
  chart('chBues', {
    type: 'bar',
    data: {
      labels: months.map(d => d.toLocaleDateString('fr-CA', { month: 'short' })),
      datasets: [{ data: months.map(d => drunk.get(key(d)) || 0), backgroundColor: '#6cc59a', borderRadius: 6 }]
    },
    options: baseOpts(false)
  });
}

/* =====================================================================
   Réglages
   ===================================================================== */
function openSettings() {
  stopScan();
  openSheet('<h2>Réglages</h2>' +
    '<p class="meta">Version de l’app : <b>' + APP_VERSION + '</b></p>' +
    '<p class="meta">Adresse de l’application web Apps Script (se termine par /exec) et jeton affiché par <code>setup</code>.</p>' +
    '<label class="field" for="setUrl">Adresse du script</label>' +
    '<input id="setUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(S.url) + '">' +
    '<label class="field" for="setToken">Jeton secret</label>' +
    '<input id="setToken" placeholder="xxxxxxxx-xxxx-…" value="' + esc(S.token) + '">' +
    '<div class="row" style="margin-top:16px"><button class="btn" onclick="closeSheet()">Fermer</button>' +
    '<button class="btn primary" id="btnSave">Enregistrer</button></div>');
  $('#btnSave').addEventListener('click', async () => {
    S.url = $('#setUrl').value.trim();
    S.token = $('#setToken').value.trim();
    store.set('url', S.url);
    store.set('token', S.token);
    closeSheet();
    await loadData();
  });
}
$('#btnSettings').addEventListener('click', openSettings);
$('#btnRefresh').addEventListener('click', () => loadData());

/* =====================================================================
   Démarrage
   ===================================================================== */
$('#appVersion').textContent = 'v' + APP_VERSION;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
buildFilters();
const startTab = new URLSearchParams(location.search).get('tab');
history.replaceState({ tab: 'scan' }, '');
setTab(['cellar', 'history', 'stats'].includes(startTab) ? startTab : 'scan');
if (!S.url || !S.token) openSettings(); else loadData(true);
</script>
</body>
</html>
