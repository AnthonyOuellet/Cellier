<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a0f1c">
<title>Cellier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #160b11;
    --surface: #24141c;
    --surface-2: #301b26;
    --line: #42283a;
    --text: #f3e9ee;
    --muted: #b49aa8;
    --accent: #c2375f;
    --accent-2: #e8b04b;
    --ok: #6cc59a;
    --danger: #e26363;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  html, body { touch-action: pan-x pan-y; }          /* bloque le pincement sur l'app */
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: linear-gradient(180deg, #2a0f1c, var(--bg));
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; flex: 1; }
  header h1 span { color: var(--accent-2); }
  header h1 small {
    font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; vertical-align: middle;
  }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  main { flex: 1; overflow-y: auto; padding: 0 16px 96px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Bottom tabs ---------- */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(22, 11, 17, .96); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    background: none; border: 0; color: var(--muted); padding: 10px 0 12px;
    font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.tabs button b { font-size: 22px; font-weight: normal; }
  nav.tabs button.active { color: var(--text); }
  nav.tabs button.active b { filter: drop-shadow(0 0 6px var(--accent)); }

  /* ---------- Scanner ---------- */
  .scanner {
    position: relative; margin-top: 8px; border-radius: 18px; overflow: hidden;
    background: #000; aspect-ratio: 3 / 4; max-height: 62vh; width: 100%;
  }
  .scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanner .frame {
    position: absolute; left: 12%; right: 12%; top: 38%; height: 24%;
    border: 2px solid rgba(255,255,255,.85); border-radius: 12px;
    box-shadow: 0 0 0 999px rgba(0,0,0,.35);
  }
  .scanner .laser {
    position: absolute; left: 14%; right: 14%; top: 50%; height: 2px;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: sweep 1.6s ease-in-out infinite alternate;
  }
  @keyframes sweep { from { transform: translateY(-28px); } to { transform: translateY(28px); } }
  .scanner .hint {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000;
  }
  .scanner .start {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: #0d0609; color: var(--muted); text-align: center; padding: 24px;
  }
  .cam-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
  .tool {
    background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .tool.on { background: var(--accent-2); color: #2a1408; border-color: var(--accent-2); }
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { flex: 1; }

  /* ---------- Forms ---------- */
  input, select {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 11px 12px; font: inherit; width: 100%; min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; }
  input.ai { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
  .ai-tag { color: var(--accent-2); font-size: 12px; margin-left: 6px; }
  label.field { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13px; }
  .btn {
    border: 0; border-radius: 12px; padding: 13px 16px; font: inherit; font-weight: 600;
    background: var(--surface-2); color: var(--text); cursor: pointer; text-align: center;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.gold { background: var(--accent-2); color: #2a1408; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .4; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* ---------- Bottom sheet ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20;
    display: none; align-items: flex-end;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-height: 88vh; overflow-y: auto; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    animation: up .22s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .grip { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 4px auto 12px; }
  .sheet h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.25; }
  .sheet h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .wine-head { display: flex; gap: 14px; align-items: flex-start; }
  .wine-head img { width: 62px; height: 92px; object-fit: contain; background: #fff; border-radius: 10px; flex: none; }
  .meta { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; font-size: 12px; color: var(--text);
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
  .actions .btn { flex-direction: column; padding: 12px 6px; font-size: 13px; }
  .actions .btn b { font-size: 20px; font-weight: normal; }
  .choice {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; font: inherit; cursor: pointer;
  }
  .choice.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice .grow { flex: 1; min-width: 0; }
  .choice small { color: var(--muted); display: block; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; font-size: 20px; }
  .stepper output { min-width: 32px; text-align: center; font-size: 20px; font-weight: 700; }
  .loading { display: flex; align-items: center; gap: 12px; padding: 24px 4px; color: var(--muted); }
  .spin {
    width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- Cellar list ---------- */
  .toolbar { position: sticky; top: 0; background: var(--bg); padding: 8px 0 10px; z-index: 2; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .filters select { padding: 9px 10px; font-size: 14px; }
  .count { color: var(--muted); font-size: 13px; margin: 6px 2px; display: flex; justify-content: space-between; gap: 8px; }
  .count label { display: flex; align-items: center; gap: 6px; }
  .count input { width: auto; }
  .wine {
    display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left;
    color: var(--text); font: inherit;
  }
  .wine .dot { width: 10px; align-self: stretch; border-radius: 6px; flex: none; }
  .wine .thumb { width: 36px; height: 54px; object-fit: contain; background: #fff; border-radius: 6px; flex: none; }
  .photo-box img { display: block; max-width: 100%; max-height: 280px; margin: 4px 0 8px; border-radius: 12px; background: #fff; }
  .noscan { margin-top: 10px; }
  .photo-box .row .btn { white-space: nowrap; font-size: 14px; padding: 12px 6px; }
  .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .img-grid button { background: #fff; border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; }
  .img-grid button:active { border-color: var(--accent); }
  .img-grid img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: contain; }
  .img-grid span { display: block; font-size: 10px; color: #333; background: #eee; padding: 2px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wine-head img, #photoPrev { cursor: zoom-in; }
  .viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: none; touch-action: none; overflow: hidden; }
  .viewer.open { display: block; }
  .viewer img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }
  .viewer .close {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px; z-index: 2;
    width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 20px;
    background: rgba(255,255,255,.18); color: #fff;
  }
  .viewer .hint2 { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.6); font-size: 12px; pointer-events: none; }
  .wine .grow { flex: 1; min-width: 0; }
  .wine .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine .qty {
    flex: none; min-width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .wine.empty { opacity: .5; }
  .month { margin: 16px 2px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .month:first-child { margin-top: 4px; }
  .wine .day {
    flex: none; width: 44px; text-align: center; line-height: 1.1; color: var(--muted); font-size: 11px;
  }
  .wine .day b { display: block; font-size: 20px; color: var(--text); }
  .tally { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .tally div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tally b { font-size: 22px; margin-right: 6px; }
  .tally span { color: var(--muted); font-size: 13px; }
  .status { font-size: 12px; }

  /* ---------- Stats ---------- */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .chart-box { position: relative; height: 240px; }
  .chart-box.tall { height: 320px; }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 16px; }
  .toast {
    position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 12px); z-index: 30;
    background: #f3e9ee; color: #1c0d14; border-radius: 12px; padding: 12px 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    transform: translateY(-20px); opacity: 0; pointer-events: none; transition: .2s;
  }
  .toast.show { transform: none; opacity: 1; }
  .toast.err { background: var(--danger); color: #fff; }
  a { color: var(--accent-2); }
</style>
</head>
<body>

<header>
  <h1>🍷 Cel<span>lier</span><small id="appVersion"></small></h1>
  <button class="icon-btn" id="btnRefresh" title="Actualiser">⟳</button>
  <button class="icon-btn" id="btnSettings" title="Réglages">⚙</button>
</header>

<main>
  <!-- ================= Scanner ================= -->
  <section class="view" id="view-scan">
    <div class="scanner">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="laser"></div>
      <div class="hint" id="scanHint">Vise le code-barres de la bouteille</div>
      <div class="cam-tools">
        <button class="tool" id="btnCam" title="Changer de caméra">⟲ Caméra</button>
        <button class="tool" id="btnZoom" title="Zoom">2×</button>
        <button class="tool" id="btnTorch" title="Lampe">🔦</button>
      </div>
      <div class="start" id="scanStart">
        <div style="font-size:42px">📷</div>
        <div id="scanMsg">Touchez pour lancer la caméra</div>
        <button class="btn primary" id="btnStartScan">Scanner une bouteille</button>
      </div>
    </div>
    <form class="manual" id="manualForm">
      <input id="manualCode" autocapitalize="off" placeholder="Code-barres, code SAQ, L + SKU LCBO ou nom">
      <button class="btn" type="submit">OK</button>
    </form>
    <button class="btn block noscan" id="btnNoCode">＋ Bouteille sans code-barres (photo)</button>
  </section>

  <!-- ================= Cellier ================= -->
  <section class="view" id="view-cellar">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Rechercher un vin, un producteur…">
      <div class="filters">
        <select id="fType"></select>
        <select id="fPays"></select>
        <select id="fCepage"></select>
        <select id="fPastille"></select>
        <select id="fStatut"></select>
        <select id="sort">
          <option value="score">Tri : à boire d'abord</option>
          <option value="nom">Tri : nom</option>
          <option value="millesime">Tri : millésime</option>
          <option value="prix">Tri : prix</option>
          <option value="pays">Tri : pays</option>
          <option value="qte">Tri : quantité</option>
        </select>
      </div>
      <div class="count">
        <span id="count"></span>
        <label><input type="checkbox" id="showEmpty"> Épuisés</label>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <!-- ================= Historique ================= -->
  <section class="view" id="view-history">
    <div class="toolbar">
      <input id="hq" type="search" placeholder="Rechercher un vin, une personne…">
      <div class="filters">
        <select id="hYear"></select>
        <select id="hType"></select>
      </div>
      <div class="count"><span id="hCount"></span></div>
    </div>
    <div id="hList"></div>
  </section>

  <!-- ================= Stats ================= -->
  <section class="view" id="view-stats">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Prêt à boire ?</h3><div class="chart-box"><canvas id="chStatut"></canvas></div></div>
    <div class="card"><h3>Par type</h3><div class="chart-box"><canvas id="chType"></canvas></div></div>
    <div class="card"><h3>Par pays</h3><div class="chart-box tall"><canvas id="chPays"></canvas></div></div>
    <div class="card"><h3>Par millésime</h3><div class="chart-box"><canvas id="chMillesime"></canvas></div></div>
    <div class="card"><h3>Cépages les plus présents</h3><div class="chart-box tall"><canvas id="chCepage"></canvas></div></div>
    <div class="card"><h3>Bouteilles bues — 12 derniers mois</h3><div class="chart-box"><canvas id="chBues"></canvas></div></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="scan"><b>⌁</b>Scanner</button>
  <button data-tab="cellar"><b>▤</b>Cellier</button>
  <button data-tab="history"><b>↺</b>Historique</button>
  <button data-tab="stats"><b>◔</b>Stats</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="" referrerpolicy="no-referrer" draggable="false"><button class="close" id="viewerClose" aria-label="Fermer">✕</button><div class="hint2">Pince pour zoomer · touche deux fois</div></div>

<script>
/* =====================================================================
   État & utilitaires
   ===================================================================== */
// Numéro de version affiché dans l'en-tête et les réglages.
// À changer à chaque mise à jour, en même temps que CACHE dans sw.js.
const APP_VERSION = '2.4';

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('cellier.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cellier.' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
  url: store.get('url', ''),
  token: store.get('token', ''),
  wines: store.get('wines', []),
  headers: store.get('headers', []),
  ai: store.get('ai', false),
  readonly: store.get('readonly', ['Statut', "Jusqu'à", 'Score', 'Column 20']),
  archive: store.get('archive', []),
  tab: 'scan',
  current: null,
  charts: {}
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(String(v == null ? '' : v).replace(',', '.').replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const qty = w => num(w['Qté']);
const money = n => n.toLocaleString('fr-CA', { style: 'currency', currency: 'CAD' });
const pct = s => (s === '' || s == null) ? '' : Math.round(num(s) * 100) + ' %';
const TYPE_COLORS = { Rouge: '#9b1d42', Blanc: '#e6cf73', 'Rosé': '#ee9db2', Mousseux: '#bcd8ea', Dessert: '#c98a2b' };
const STATUS_ORDER = ['🚨 Fin de fenêtre', '🔥 À boire', '🍷 Ouvrir 1 bouteille', '🟠 Bientôt', '👀 Surveiller actif', '🟢 Attendre'];
const STATUS_COLORS = ['#e26363', '#ef8a3c', '#c2375f', '#e8b04b', '#8fa7d9', '#6cc59a'];

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, isErr ? 4500 : 2600);
}

async function api(action, params = {}, post = false) {
  if (!S.url || !S.token) { openSettings(); throw new Error("Configure d'abord l'adresse du script et le jeton."); }
  let res;
  if (post) {
    // Content-Type text/plain par défaut : pas de requête préliminaire CORS
    res = await fetch(S.url, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, params)) });
  } else {
    const q = new URLSearchParams(Object.assign({ action, token: S.token }, params));
    res = await fetch(S.url + (S.url.includes('?') ? '&' : '?') + q.toString());
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Réponse invalide du script (déploiement à vérifier).'); }
  if (!j.ok) throw new Error(j.error || 'Erreur inconnue');
  return j;
}

/* =====================================================================
   Données
   ===================================================================== */
async function loadData(quiet) {
  if (!S.url || !S.token) return;
  try {
    const [c, a] = await Promise.all([api('cellar'), api('archive')]);
    S.wines = c.wines || [];
    if (c.headers) { S.headers = c.headers; store.set('headers', S.headers); }
    if (c.readonly) { S.readonly = c.readonly; store.set('readonly', S.readonly); }
    S.ai = !!c.ai; store.set('ai', S.ai);
    S.archive = a.rows || [];
    store.set('wines', S.wines);
    store.set('archive', S.archive);
    buildFilters();
    renderList();
    if (S.tab === 'stats') renderStats();
    if (S.tab === 'history') renderHistory();
    if (!quiet) toast('Cellier à jour');
  } catch (e) {
    toast(e.message, true);
  }
}

/* =====================================================================
   Onglets
   ===================================================================== */
/*
 * Bouton Retour d'Android :
 *   historique = [scanner] ou [scanner, autre onglet], + une entrée tant qu'une carte est ouverte.
 *   Retour ferme la carte, puis ramène au scanner ; depuis le scanner, il quitte l'app.
 */
let ignorePop = false;

function setTab(tab) {
  const cur = (history.state && history.state.tab) || 'scan';
  if (tab === 'scan') {
    if (cur !== 'scan') { ignorePop = true; history.back(); }
  } else if (cur === 'scan') {
    history.pushState({ tab }, '');
  } else {
    history.replaceState({ tab }, '');
  }
  applyTab(tab);
}

window.addEventListener('popstate', e => {
  if (ignorePop) { ignorePop = false; return; }
  if (isViewerOpen()) { hideViewer(); return; }
  if (isSheetOpen()) { hideSheet(); return; }
  applyTab((e.state && e.state.tab) || 'scan');
});

function applyTab(tab) {

/* =====================================================================
   Scanner
   ===================================================================== */
// Un code n'est accepté que s'il a un chiffre de contrôle valide
// ET qu'il a été lu CONFIRM_READS fois à l'identique.
const CONFIRM_READS = 3;
const ZOOM_STEPS = [1, 1.5, 2, 3];
const scan = {
  stream: null, track: null, detector: null, running: false, reads: {},
  camId: store.get('camId', ''), zoom: store.get('zoom', 2), torch: false
};

/** Chiffre de contrôle GTIN (EAN-8, UPC-A, EAN-13, GTIN-14). */
function validGtin(code) {
  const d = String(code || '');
  if (!/^\d+$/.test(d) || ![8, 12, 13, 14].includes(d.length)) return false;
  const digits = d.split('').map(Number);
  const check = digits.pop();
  const sum = digits.reverse().reduce((s, n, i) => s + n * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === check;
}

/** Numéro de capteur dans le libellé Android ("camera2 0, facing back" → 0). */
const camNum = label => {
  const m = String(label).match(/camera\d*\s+(\d+)/i) || String(label).match(/(\d+)\s*,/) || String(label).match(/(\d+)/);
  return m ? Number(m[1]) : 99;
};

async function backCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const back = devs.filter(d => /back|arri[eè]re|rear|environment/i.test(d.label));
  return (back.length ? back : devs).sort((a, b) => camNum(a.label) - camNum(b.label));
}

function stopTracks() {
  if (scan.stream) scan.stream.getTracks().forEach(t => t.stop());
  scan.stream = null;
  scan.track = null;
}

async function openCamera(deviceId) {
  const video = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  if (deviceId) video.deviceId = { exact: deviceId };
  else video.facingMode = { ideal: 'environment' };
  scan.stream = await navigator.mediaDevices.getUserMedia({ video });
  scan.track = scan.stream.getVideoTracks()[0];
  const v = $('#video');
  v.srcObject = scan.stream;
  await v.play();
  await tuneCamera();
}

/** Mise au point continue, zoom et lampe quand le capteur les offre. */
async function tuneCamera() {
  const t = scan.track;
  const caps = (t && t.getCapabilities) ? t.getCapabilities() : {};
  const adv = {};
  if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
  let z = 1;
  if (caps.zoom) {
    z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, scan.zoom));
    adv.zoom = z;
  }
  if (caps.torch) adv.torch = scan.torch;
  try { if (Object.keys(adv).length) await t.applyConstraints({ advanced: [adv] }); } catch (e) { /* ignoré */ }
  $('#btnZoom').style.display = caps.zoom ? '' : 'none';
  $('#btnZoom').textContent = (Math.round(z * 10) / 10) + '×';
  $('#btnTorch').style.display = caps.torch ? '' : 'none';
  $('#btnTorch').classList.toggle('on', !!scan.torch);
}

function cameraError() {
  scan.running = false;
  $('#scanStart').style.display = 'flex';
  $('#scanMsg').textContent = "Caméra non disponible. Autorise l'accès à la caméra, puis réessaie.";
}

async function startScan() {
  if (scan.running || isSheetOpen()) return;
  if (!('BarcodeDetector' in window)) {
    $('#scanMsg').textContent = "Ce navigateur ne lit pas les codes-barres. Utilise Chrome sur Android, ou entre le code à la main.";
    $('#btnStartScan').style.display = 'none';
    return;
  }
  try {
    if (!scan.detector) {
      const wanted = ['ean_13', 'upc_a', 'ean_8'];
      const supported = await BarcodeDetector.getSupportedFormats();
      scan.detector = new BarcodeDetector({ formats: wanted.filter(f => supported.includes(f)) });
    }
    try {
      await openCamera(scan.camId);
    } catch (e) {
      if (!scan.camId) throw e;
      scan.camId = ''; store.set('camId', '');      // caméra mémorisée disparue
      await openCamera('');
    }
    // Première fois : choisir le capteur principal (le plus petit numéro à l'arrière)
    if (!scan.camId) {
      const cams = await backCameras();
      const main = cams[0];
      const current = scan.track.getSettings().deviceId;
      if (main && main.deviceId && main.deviceId !== current) {
        stopTracks();
        try { await openCamera(main.deviceId); } catch (e) { await openCamera(''); }
      }
      scan.camId = (scan.track.getSettings().deviceId) || '';
      store.set('camId', scan.camId);
    }
  } catch (e) {
    return cameraError();
  }
  scan.reads = {};
  scan.running = true;
  $('#scanStart').style.display = 'none';
  setScanHint();
  detectLoop();
}

function stopScan() {
  scan.running = false;
  stopTracks();
  $('#scanStart').style.display = 'flex';
  $('#scanMsg').textContent = 'Touchez pour lancer la caméra';
}

function setScanHint() {
  const best = Math.max(0, ...Object.values(scan.reads));
  $('#scanHint').textContent = best
    ? 'Lecture… ' + '●'.repeat(best) + '○'.repeat(Math.max(0, CONFIRM_READS - best))
    : 'Vise le code-barres de la bouteille';
}

async function detectLoop() {
  if (!scan.running) return;
  try {
    const codes = await scan.detector.detect($('#video'));
    for (const c of codes) {
      const code = String(c.rawValue || '').trim();
      if (!validGtin(code)) continue;               // lecture partielle ou erronée
      scan.reads[code] = (scan.reads[code] || 0) + 1;
      if (scan.reads[code] >= CONFIRM_READS) {
        stopScan();
        if (navigator.vibrate) navigator.vibrate(60);
        openLookup(code);
        return;
      }
    }
    if (codes.length) setScanHint();
  } catch (e) { /* image pas prête */ }
  setTimeout(detectLoop, 90);
}

async function switchCamera() {
  try {
    const cams = await backCameras();
    if (cams.length < 2) return toast('Une seule caméra disponible');
    const i = cams.findIndex(c => c.deviceId === scan.camId);
    const next = cams[(i + 1) % cams.length];
    stopTracks();
    await openCamera(next.deviceId);
    scan.camId = next.deviceId;
    store.set('camId', scan.camId);
    scan.reads = {};
    toast('Caméra ' + ((i + 1) % cams.length + 1) + '/' + cams.length + (next.label ? ' — ' + next.label : ''));
  } catch (e) {
    toast('Impossible de changer de caméra', true);
  }
}

$('#btnStartScan').addEventListener('click', startScan);
$('#btnNoCode').addEventListener('click', addWithoutCode);
$('#btnCam').addEventListener('click', switchCamera);
$('#btnZoom').addEventListener('click', async () => {
  const i = ZOOM_STEPS.findIndex(z => z >= scan.zoom - 0.01);
  scan.zoom = ZOOM_STEPS[(i + 1) % ZOOM_STEPS.length];
  store.set('zoom', scan.zoom);

$('#btnTorch').addEventListener('click', async () => {

$('#manualForm').addEventListener('submit', e => {

  $('#manualCode').value = '';
  stopScan();
  // « L78006 » ou « LCBO 78006 » = SKU LCBO ; 8 chiffres = code SAQ ; plus long = code-barres
  const digits = v.replace(/\D/g, '');
  if (/^l(cbo)?\s*#?\s*\d+$/i.test(v)) openLookup('', '', digits);
  else if (/[a-zà-ÿ]{2,}/i.test(v)) openNameSearch(v);
  else if (digits.length === 8 && !digits.startsWith('0')) openLookup('', digits);
  else openLookup(v);
});

/* ---------------------------- Visionneuse de photo (zoom) ---------------------------- */
const V = { s: 1, x: 0, y: 0, fitW: 0, fitH: 0, pts: new Map(), start: null, lastTap: 0 };

function isViewerOpen() { return $('#viewer').classList.contains('open'); }

/** Version plus grande d'une photo Google Drive (les miniatures sont en 800 px). */
const bigUrl = u => String(u).replace(/([?&]sz=)w\d+/, '$1w2000');

function openViewer(src) {
  if (!src) return;
  const img = $('#viewerImg');
  img.onload = () => fitViewer();
  img.src = /^data:/.test(src) ? src : bigUrl(src);
  $('#viewer').classList.add('open');
  history.pushState({ tab: S.tab, sheet: isSheetOpen(), viewer: true }, '');
  if (img.complete && img.naturalWidth) fitViewer();
}

function closeViewer() {
  if (!isViewerOpen()) return;
  if (history.state && history.state.viewer) { ignorePop = true; history.back(); }
  hideViewer();
}

function hideViewer() {
  $('#viewer').classList.remove('open');
  V.pts.clear();
}

function fitViewer() {
  const img = $('#viewerImg');
  const W = innerWidth, H = innerHeight;
  const k = Math.min(W / img.naturalWidth, H / img.naturalHeight);
  V.fitW = img.naturalWidth * k; V.fitH = img.naturalHeight * k;
  img.style.width = V.fitW + 'px'; img.style.height = V.fitH + 'px';
  V.s = 1; V.x = (W - V.fitW) / 2; V.y = (H - V.fitH) / 2;
  applyViewer();
}

function applyViewer() {
  $('#viewerImg').style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.s + ')';
}

/** Zoom de facteur s autour du point (px, py) de l'écran. */
function zoomAt(px, py, s) {
  s = Math.max(1, Math.min(6, s));
  V.x = px - (px - V.x) * (s / V.s);
  V.y = py - (py - V.y) * (s / V.s);
  V.s = s;
}

/** Empêcher l'image de sortir de l'écran ; à 1× elle se recentre. */
function clampViewer() {
  if (V.s <= 1.02) { fitViewer(); return; }
  const W = innerWidth, H = innerHeight, w = V.fitW * V.s, h = V.fitH * V.s;
  V.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, V.x));
  V.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, V.y));
  applyViewer();
}

(function initViewer() {
  const el = $('#viewer');
  const snapshot = () => {
    const p = [...V.pts.values()];
    V.start = { s: V.s, x: V.x, y: V.y, p };
    if (p.length >= 2) {
      V.start.d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      V.start.mx = (p[0].x + p[1].x) / 2; V.start.my = (p[0].y + p[1].y) / 2;
    }
  };
  el.addEventListener('pointerdown', e => {
    if (e.target.id === 'viewerClose') return;
    el.setPointerCapture(e.pointerId);
    V.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    snapshot();
  });
  el.addEventListener('pointermove', e => {
    if (!V.pts.has(e.pointerId) || !V.start) return;
    V.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...V.pts.values()], st = V.start;
    if (p.length >= 2 && st.d) {                       // pincement : zoom + déplacement du milieu
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      const s = Math.max(1, Math.min(6, st.s * d / st.d));
      V.s = s;
      V.x = mx - (st.mx - st.x) * (s / st.s);
      V.y = my - (st.my - st.y) * (s / st.s);
      applyViewer();
    } else if (p.length === 1 && V.s > 1 && st.p.length === 1) {   // glisser quand c'est zoomé
      V.x = st.x + (p[0].x - st.p[0].x);
      V.y = st.y + (p[0].y - st.p[0].y);
      applyViewer();
    }
  });
  const end = e => {
    if (!V.pts.has(e.pointerId)) return;
    const st = V.start, wasSingle = st && st.p.length === 1 && V.pts.size === 1;
    const moved = st && st.p[0] ? Math.hypot(e.clientX - st.p[0].x, e.clientY - st.p[0].y) : 0;
    V.pts.delete(e.pointerId);
    if (wasSingle && moved < 10) {                     // une touche (pas un glissement)
      const now = Date.now();
      if (now - V.lastTap < 300) {                     // double touche : 2,5× ou retour
        if (V.s > 1.05) fitViewer(); else { zoomAt(e.clientX, e.clientY, 2.5); clampViewer(); }
        V.lastTap = 0;
      } else V.lastTap = now;
    }
    if (V.pts.size) snapshot(); else { V.start = null; clampViewer(); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); clampViewer(); }, { passive: false });
  $('#viewerClose').addEventListener('click', closeViewer);
  addEventListener('resize', () => { if (isViewerOpen()) fitViewer(); });
  // Toucher une photo dans une carte ou un formulaire → visionneuse
  $('#sheet').addEventListener('click', e => {
    const img = e.target.closest('.wine-head img, #photoPrev');
    if (img && img.getAttribute('src')) openViewer(img.getAttribute('src'));
  });
})();
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });

   Recherche d'une bouteille → carte d'action

async function openLookup(barcode, saq, lcbo) {

  try {

    S.current = {
      barcode: r.barcode || '',
      saq: r.saq || '',

      matches: r.matches || [],

    };

    openSheet('<h2>Oups</h2><p class="meta">' + esc(e.message) + '</p>' +
      '<button class="btn block" onclick="closeSheet()">Fermer</button>');
  }
}

/* ---------------------------- Historique (onglet Archive) ---------------------------- */
const normName = s => String(s == null ? '' : s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').trim();

const toDate = v => { const d = v ? new Date(v) : null; return d && !isNaN(d) ? d : null; };

function fmtDate(v, withWeekday) {
  const d = toDate(v);
  if (!d) return String(v || 'Date inconnue');
  return d.toLocaleDateString('fr-CA', withWeekday
    ? { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }
    : { day: 'numeric', month: 'short', year: 'numeric' });
}

/** Les lignes de l'Archive qui correspondent au vin de la carte (même nom, tous millésimes). */
function historyFor(c) {
  const names = new Set();
  c.matches.forEach(m => names.add(normName(m['Nom'])));
  if (c.product && c.product.name) names.add(normName(c.product.name));
  if (c.ref && c.ref['Nom']) names.add(normName(c.ref['Nom']));
  names.delete('');
  return S.archive
    .filter(r => names.has(normName(r['Nom'])))
    .sort((a, b) => ((toDate(b['Bu le']) || 0) - (toDate(a['Bu le']) || 0)));
}

/** Une dégustation : date, millésime, avec qui, note. withName = afficher le nom du vin. */
function histLine(r, withName) {
  const note = r['Note /10'] !== '' && r['Note /10'] != null ? ' · ' + esc(r['Note /10']) + '/10' : '';
  const title = withName
    ? '<b>' + esc(r['Nom']) + '</b> ' + esc(r['Millésime'] || '')
    : '<b>' + esc(fmtDate(r['Bu le'], true)) + '</b>';
  const sub = withName
    ? fmtDate(r['Bu le'], true)
    : (r['Millésime'] ? 'Millésime ' + r['Millésime'] : 'Sans millésime');
  return '<div class="grow">' + title +
    '<small>' + esc(sub) + note + '</small>' +
    (r['Avec'] ? '<small>avec ' + esc(r['Avec']) + '</small>' : '') + '</div>';
}

function cardHeader(c) {
  const p = c.product;
  const m = c.matches[0] || c.ref || {};
  const name = (p && p.name) || m['Nom'] || 'Bouteille inconnue';
  const bits = p
    ? [p.type, p.country, p.region].filter(Boolean)
    : [m['Type'], m['Pays'], m['Région / Appellation']].filter(Boolean);
  const chips = [];
  if (p && p.source && p.source !== 'SAQ') {
    chips.push({ LCBO: 'Trouvé à la LCBO', OFF: 'Open Food Facts (infos limitées)' }[p.source] || p.source);
  }
  const pastille = (p && p.pastille) || m['Pastille'];
  if (pastille) chips.push(pastille);
  const price = (p && p.price) || num(m['Prix']);
  if (price) chips.push(money(price));
  if (p && p.gardeText) chips.push('⏳ ' + p.gardeText);
  if (p && p.grape) chips.push(p.grape);
  else if (m['Cépage']) chips.push(m['Cépage']);
  return '<div class="wine-head">' +
    ((p && p.image) || m['Photo'] ? '<img src="' + esc((p && p.image) || m['Photo']) + '" alt="" referrerpolicy="no-referrer">' : '') +
    '<div><h2>' + esc(name) + '</h2><div class="meta">' + esc(bits.join(' · ')) + '</div>' +
    '<div class="chips">' + chips.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div></div></div>';
}

function matchLine(m) {
  return '<div class="grow"><b>' + esc(m['Millésime'] || 'Sans millésime') + '</b> — ' + qty(m) + ' btl' +
    '<small>' + esc(m['Statut'] || '') + (m['Score'] !== '' && m['Score'] != null ? ' · ' + pct(m['Score']) : '') +
    (m["Jusqu'à"] ? ' · jusqu’à ' + esc(m["Jusqu'à"]) : '') + '</small></div>';
}

function renderCard() {
  const c = S.current;
  if (!c) return;
  const inStock = c.matches.filter(m => qty(m) > 0);
  const hist = historyFor(c);
  const bottles = c.matches.reduce((s, m) => s + Math.max(0, qty(m)), 0);
  let html = cardHeader(c);

  html += '<div class="tally">' +
    '<div><b>' + bottles + '</b><span>au cellier</span></div>' +
    '<div><b>' + hist.length + '</b><span>' + (hist.length > 1 ? 'bues' : 'bue') + '</span></div></div>';

  html += '<h3>Dans ton cellier</h3>';
  if (c.matches.length) {
    html += c.matches
      .slice().sort((a, b) => num(a['Millésime']) - num(b['Millésime']))
      .map(m => '<div class="choice">' + matchLine(m) +
        '<button class="chip" onclick="startEdit(' + m.row + ')">✎ Modifier</button></div>').join('');
  } else if (c.suggestions.length) {
    html += '<p class="meta">Cette bouteille n’est pas encore liée à ta feuille. ' +
      'Ces vins de ton cellier ont un nom qui ressemble. Est-ce l’un d’eux ?</p>' +
      c.suggestions.map((s, i) =>
        '<button class="choice" onclick="linkSuggestion(' + i + ')">' + suggestionLine(s) +
        '<span class="chip">C’est lui</span></button>').join('') +
      '<div class="row"><button class="btn" onclick="startLink()">Une autre bouteille…</button>' +
      '<button class="btn" onclick="dismissSuggestions()">Nouveau vin</button></div>';
  } else if (!c.product && c.barcode) {
    html += '<p class="meta">Code lu : <b>' + esc(c.barcode) + '</b> — introuvable à la SAQ et dans ta feuille. ' +
      'Si ce n’est pas le code de la bouteille, rescanne. Sinon, cherche le vin par le nom sur l’étiquette : ' +
      'le code-barres lui sera lié.</p>' +
      productSearchHtml('') +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn" onclick="closeSheet()">⌁ Rescanner</button>' +
      '<button class="btn" onclick="startLink()">Déjà dans ma feuille…</button></div>' +
      '<label class="field" for="lcboSku">Ou SKU LCBO trouvé sur lcbo.com</label>' +
      '<div class="row"><input id="lcboSku" inputmode="numeric" placeholder="ex. 78006">' +
      '<button class="btn gold" style="flex:none" onclick="loadLcboSku()">Charger</button></div>';
  } else {
    html += '<p class="meta">Pas encore dans le cellier.</p>';
    if (c.barcode || c.saq) {
      html += '<button class="btn block" onclick="startLink()">Elle y est sous un autre nom : l’associer…</button>';
    }
  }

  if (hist.length) {
    const shown = c.showAllHist ? hist : hist.slice(0, 5);
    html += '<h3>Historique</h3>' + shown.map(r => '<div class="choice">' + histLine(r, false) + '</div>').join('');
    if (hist.length > shown.length) {
      html += '<button class="btn block" onclick="S.current.showAllHist = true; renderCard()">Voir les ' +
        hist.length + ' dégustations</button>';
    }
  }

  const infoUrl = c.saq
    ? 'https://www.saq.com/fr/' + encodeURIComponent(c.saq)
    : (c.product && c.product.url) ? c.product.url
    : 'https://www.saq.com/fr/catalogsearch/result/?q=' + encodeURIComponent((c.product && c.product.name) || (c.matches[0] || {})['Nom'] || c.barcode);

  html += '<div class="actions">' +
    '<a class="btn" href="' + esc(infoUrl) + '" target="_blank" rel="noopener"><b>ⓘ</b>Voir l’info</a>' +
    '<button class="btn gold" onclick="startAdd()"><b>＋</b>Ajouter</button>' +
    '<button class="btn primary" onclick="startRemove()"' + (inStock.length ? '' : ' disabled') + '><b>−</b>Retirer</button>' +
    '</div>';
  html += '<button class="btn block" style="margin-top:10px" onclick="closeSheet()">Fermer</button>';
  openSheet(html);
  bindProductSearch();
}

/** Ligne d'une suggestion : le nom du vin d'abord, pour savoir de quelle bouteille il s'agit. */
function suggestionLine(s) {
  return '<div class="grow"><b>' + esc(s['Nom']) + '</b> ' + esc(s['Millésime'] || '') +
    '<small>' + esc([s['Producteur'], s['Pays']].filter(Boolean).join(' · ')) + '</small>' +
    '<small>' + qty(s) + ' btl · ' + esc(s['Statut'] || '') +
    (s['Score'] !== '' && s['Score'] != null ? ' · ' + pct(s['Score']) : '') + '</small></div>';
}

function dismissSuggestions() {
  S.current.suggestions = [];
  renderCard();
}

/* ---------------------------- Associer une bouteille scannée à une ligne ---------------------------- */
/*
 * Le code-barres (et le code SAQ) sont enregistrés sur la ligne choisie, et ses colonnes peuvent être
 * mises à jour avec la fiche SAQ / LCBO. Le prochain scan reconnaît directement le vin.
 */
// [colonne, champ de la fiche, coché par défaut si la feuille a déjà une valeur différente]
const LINK_FIELDS = [
  ['Nom', 'name', false], ['Producteur', 'producer', true], ['Pays', 'country', true],
  ['Région / Appellation', 'region', true], ['Appellation', 'appellation', true], ['Type', 'type', true],
  ['Cépage', 'grape', true], ['Pastille', 'pastille', true], ['Garde', 'gardeYears', false], ['Prix', 'price', false], ['Photo', 'image', false]
];

function linkSuggestion(i) {
  const s = S.current.suggestions[i];
  linkPick(s.row, s);
}

/** Choisir la ligne parmi toute la feuille (le nom peut être très différent de celui de la SAQ). */
function startLink() {
  const c = S.current;
  openSheet(cardHeader(c) + '<h3>À quelle bouteille de ta feuille ?</h3>' +
    '<input id="linkQ" type="search" placeholder="Rechercher par nom, producteur, millésime…">' +
    '<div id="linkList" style="margin-top:10px"></div>' +
    '<button class="btn block" onclick="renderCard()">Retour</button>');
  $('#linkQ').addEventListener('input', renderLinkList);
  renderLinkList();
}

function renderLinkList() {
  const q = normName(($('#linkQ') || {}).value || '');
  const rows = S.wines
    .filter(w => !q || normName([w['Nom'], w['Producteur'], w['Millésime'], w['Pays']].join(' ')).includes(q))
    .sort((a, b) => String(a['Nom']).localeCompare(String(b['Nom']), 'fr') || num(a['Millésime']) - num(b['Millésime']))
    .slice(0, 40);
  $('#linkList').innerHTML = rows.length
    ? rows.map(w => '<button class="choice" onclick="linkPick(' + w.row + ')">' + suggestionLine(w) + '</button>').join('')
    : '<p class="meta">Aucun vin ne correspond.</p>';
}

const sameVal = (a, b) => {
  const x = cellStr(a).trim(), y = cellStr(b).trim();
  if (x === y) return true;
  if (/^-?\d+([.,]\d+)?$/.test(x) && /^-?\d+([.,]\d+)?$/.test(y)) return num(x) === num(y);
  return x.toLowerCase() === y.toLowerCase();
};

/** Écran de comparaison : ce que la fiche changerait dans la ligne choisie. */
function linkPick(row, fallback) {
  const c = S.current;
  const w = S.wines.find(x => x.row === row) || fallback;
  if (!w) return toast('Ligne introuvable : actualise le cellier (⟳)', true);
  c.link = { w };
  const p = c.product || {};
  const src = { SAQ: 'SAQ', LCBO: 'LCBO', OFF: 'Open Food Facts' }[p.source] || 'SAQ';
  const diffs = LINK_FIELDS
    .map(([h, key, onIfFilled]) => ({ h, v: p[key], old: w[h], on: onIfFilled }))
    .filter(d => d.v !== null && d.v !== undefined && cellStr(d.v).trim() !== '' && (w[d.h] !== undefined || S.headers.includes(d.h)) && !sameVal(d.old, d.v));

  let html = cardHeader(c) + '<h3>Associer à</h3><div class="choice">' + suggestionLine(w) + '</div>';
  if (diffs.length) {
    html += '<h3>Mettre à jour avec la fiche ' + src + '</h3>' +
      diffs.map((d, i) => {
        const empty = !cellStr(d.old).trim();
        return '<label class="choice"><input type="checkbox" data-link="' + i + '"' + (empty || d.on ? ' checked' : '') +
          ' style="width:auto;flex:none"><div class="grow"><b>' + esc(d.h) + '</b>' +
          '<small>Feuille : ' + (empty ? '<i>(vide)</i>' : esc(d.old)) + '</small>' +
          '<small>' + src + ' : ' + esc(d.v) + '</small>' +
          (d.h === 'Nom' ? '<small>⚠ Renommer sépare ce vin de son historique sous l’ancien nom.</small>' : '') +
          '</div></label>';
      }).join('');
  } else if (c.product) {
    html += '<p class="meta">Les infos de ta feuille correspondent déjà à la fiche ' + src + '.</p>';
  }
  html += '<p class="meta">' + (c.saq ? 'Le code SAQ ' + esc(c.saq) + ' et l' : 'L') + 'e code-barres ' + esc(c.barcode || '') +
    ' seront enregistrés sur cette ligne : le prochain scan reconnaîtra directement ce vin.</p>' +
    '<div class="row" style="margin-top:12px"><button class="btn" onclick="startLink()">Autre bouteille</button>' +
    '<button class="btn primary" id="btnDoLink">Associer</button></div>';
  c.link.diffs = diffs;
  openSheet(html);
  $('#btnDoLink').addEventListener('click', doLink);
}

async function doLink() {
  const c = S.current;
  const w = c.link.w;
  const fields = {};
  document.querySelectorAll('#sheet [data-link]').forEach(el => {
    if (el.checked) { const d = c.link.diffs[Number(el.dataset.link)]; fields[d.h] = cellStr(d.v); }
  });
  if (c.saq) fields['Code SAQ'] = c.saq;
  if (c.barcode) {
    const pad = x => x.replace(/\D/g, '').padStart(14, '0');
    const list = cellStr(w['Code-barres']).split(/[\s,;]+/).filter(Boolean).map(pad);
    if (!list.includes(pad(c.barcode))) list.push(pad(c.barcode));
    fields['Code-barres'] = list.join(' ');
  }
  if (!Object.keys(fields).length) return toast('Rien à enregistrer', true);
  loadingSheet('Association dans la feuille…');
  try {
    await api('update', { row: w.row, name: w['Nom'], vintage: w['Millésime'], fields }, true);
    toast('Bouteille associée : le prochain scan la reconnaîtra');
    await loadData(true);
    if (c.barcode) openLookup(c.barcode);          // la carte du vin, maintenant reconnu
    else openFromList(w.row);
  } catch (e) {
    toast(e.message, true);
    renderCard();
  }
}

/* ---------------------------- Retirer ---------------------------- */
function startRemove() {
  const c = S.current;
  const list = c.matches.filter(m => qty(m) > 0).sort((a, b) => num(b['Score']) - num(a['Score']));
  if (!list.length) return toast('Plus de bouteille de ce vin', true);

}

function confirmRemove(m) {

async function doRemove(m) {

    }, true);
